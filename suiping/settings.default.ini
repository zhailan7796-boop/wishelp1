[General]
Enabled=1
Engine=native
FollowPeek=1
BringActiveAcrossMonitors=1
ActivationTimeoutMs=8000
StableDelayMs=180

[AppIdMap]
Microsoft.Windows.Explorer=explorer.exe
Chrome=chrome.exe
MSEdge=msedge.exe
com.electron.Feishu=Feishu.exe

; Optional link handler (tray menu item). Browser/BrowserArgs are filled in
; from the previous default browser when it is set up. Enabled=0 opens links
; normally; ReuseScreenWindow=0 always opens a new window on the clicked screen.
[LinkFollow]
Enabled=1
ReuseScreenWindow=1
